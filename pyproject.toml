[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-portfolio"
version = "0.1.0"
description = "An MLOps flower classification project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tensorflow>=2.21",
    "numpy",
    "pillow",
    "opencv-python-headless",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "hydra-core",
    "mlflow",
    "dvc",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=flower_classifier --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]